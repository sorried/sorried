name: Update Local Time

on:
  schedule:
    # Runs every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update-time:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Time JSON
        run: |
          python3 -c "
          import json, datetime
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5)))
          time_str = now.strftime('%H:%M (UTC+5)')
          data = {
              'schemaVersion': 1,
              'label': 'local time',
              'message': time_str,
              'color': '7050b8',
              'style': 'flat-square'
          }
          with open('assets/time.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/time.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update local time" && git push)
